
<!DOCTYPE html>
<html>
    <head>
        <title>YouTube.com Clone</title>

        <style>
            .tnail {
                width: 300px;
                display: block;
            }

            .search-bar {
                display: block;
            }

            .video-preview {
                width: 300px;
                display: inline-block;
                vertical-align: top;
                margin-right: 20px;
            }

            .channel-pic {
                display: inline-block;
                width: 50px;
                vertical-align: top;
            }

            .channel-pic img {
                width: 50px;
                border-radius: 50%;
            }

            .video-info {
                display: inline-block;
                width: 240px;
                vertical-align: top;
            }

            .video-title {
                margin-top: 0;
                font-weight: bold;
            }

            .video-author,
            .video-stats {
                color: gray;
                font-size: 14px;
            }
        </style>
    </head>

    <body>

        <input class="search-bar" type="text" placeholder="search">

        <div class="video-preview">

            <img class="tnail" src="tnail/thumbnail-1.webp">

            <div class="channel-pic">
                <img src="Channel PFP/channel-1.jpeg">
            </div>

            <div class="video-info">

                <p class="video-title">
                    Talking Tech with Sundar Pichai!
                </p>

                <p class="video-author">
                    Marques Brownlee
                </p>

                <p class="video-stats">
                    3.4M views · 6 months ago
                </p>

            </div>

        </div>

        <div class="video-preview">

            <img class="tnail" src="tnail/thumbnail-2.webp">

            <div class="channel-pic">
                <img src="Channel PFP/channel-2.jpeg">
            </div>

            <div class="video-info">

                <p class="video-title">
                    Try Not to Laugh
                </p>

                <p class="video-author">
                    Markiplier
                </p>

                <p class="video-stats">
                    14M views · 4 years ago
                </p>

            </div>

        </div>

    </body>
</html>
